name: Deploy to GitHub Pages

# 把 app/ 的靜態網站（木人樁練習 / 之後的單機對戰）部署到 GitHub Pages。
# 連線對戰需要 Node 伺服器，不在此 workflow 範圍。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build
        # base 設成 /<repo>/，讓資源在 https://<user>.github.io/<repo>/ 下正確載入
        run: npm run build:client
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # 連線對戰的伺服器位址（Zeabur）。沒設時連線對戰維持停用，
          # 單機模式不受影響。
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
